[package]
name = "rtodo_mobile_transfer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rtodo-transfer-core = { path = "../../../crates/transfer-core" }
flutter_rust_bridge = "=2.13.0"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
strip = true
