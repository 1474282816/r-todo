[package]
name = "rtools-desktop"
version = "0.3.7"
description = "RTools Windows 桌面端"
authors = ["you"]
edition = "2021"

[lib]
name = "rtools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 发行构建必须启用：让 tauri-build 把 frontendDist（../dist）内嵌进 exe。
# 缺了它就会用 devUrl(http://localhost:1420)，拷到没有 vite 的机器上就是白屏。
# `cargo build --release --features custom-protocol` / `tauri build` 会带上此 feature。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"

# 数据存储
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }

# 系统通知
tauri-plugin-notification = "2.2"

# 位置尺寸记忆
tauri-plugin-window-state = "2.2"

# 开机自启
tauri-plugin-autostart = "2.2"

# 单实例（避免开机自启 + 手动启动出两个窗口）
tauri-plugin-single-instance = "2.2"

# 文件对话框 + 文件读写（用于导入导出）
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"

# 应用内更新
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# 通用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
log = "0.4"

# MCP 配置 token 生成
rand = "0.10"

# 挂件材质：读壁纸 → 缩放高斯模糊 → PNG → base64（模拟 Mica，换壁纸实时刷新）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
base64 = "0.22"

# 局域网互传（LocalSend 兼容，共享 core）
rtodo-transfer-core = { path = "../../../crates/transfer-core" }
rtools-battery = { path = "../../../crates/rtools-workspace/rtools-battery" }

# MCP server（streamable HTTP）
# rusqlite 0.40 需要 libsqlite3-sys ^0.38，与 tauri-plugin-sql(sqlx) 的 libsqlite3-sys 0.28 冲突；
# 降到 0.31（同用 libsqlite3-sys 0.28）以共存
rmcp = { version = "3.3", features = ["transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
# WorkerW 挂载所需 Win32 API
# Win32_UI_Shell + Win32_System_Com：任务栏按钮（ITaskbarList::DeleteTab）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
] }

[dev-dependencies]
# .json() 需要 json feature（default-features = false 时默认没有）
reqwest = { version = "0.12", default-features = false, features = ["json"] }
