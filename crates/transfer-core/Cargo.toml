[package]
name = "rtodo-transfer-core"
version = "0.1.0"
edition = "2021"
description = "r-todo LAN transfer core (LocalSend-compatible), shared by desktop and mobile"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
